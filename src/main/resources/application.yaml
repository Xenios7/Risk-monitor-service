server:
  port: 8081

spring:
  application:
    name: risk-monitor-service

  datasource:
    url: jdbc:postgresql://localhost:5434/riskmonitor
    username: risk
    password: risk
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: risk-monitor-service
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde