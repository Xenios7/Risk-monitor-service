server:
  port: 8081

spring:
  application:
    name: risk-monitor-service

  datasource:
    url: jdbc:postgresql://localhost:5434/riskmonitor
    username: risk
    password: risk
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: risk-monitor-service
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.riskmonitor.risk_monitor_service.model.FlaggedOrderPayload
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.riskmonitor.risk_monitor_service.model